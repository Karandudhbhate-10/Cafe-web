services:
  - type: web
    name: brew-and-bean-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: QR_BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RECOVERY_KEY
        sync: false
      - key: CAFE_UPI_ID
        value: karandudhbhate2@oksbi
      - key: CAFE_PAYEE_NAME
        value: "BREW AND BEAN CAFE"
